name: ShelfSense CI

on:
  push:
    branches: [ main, "fix/**", "feature/**" ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Tests (Java 21 / PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shelfsense
          POSTGRES_USER: shelfsense
          POSTGRES_PASSWORD: shelfsense_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shelfsense"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Python for ML Service dependency
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Start ML Service daemon for full-stack integration tests
        run: |
          python -m pip install -r ml/requirements.txt
          PYTHONPATH=ml nohup python -m uvicorn ml.src.api.main:app --host 127.0.0.1 --port 8001 > ml.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -f http://127.0.0.1:8001/health; then
              echo "ML service is healthy"
              break
            fi
            sleep 1
          done
          curl -f http://127.0.0.1:8001/health || (cat ml.log && exit 1)

      - name: Run Maven Tests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/shelfsense
          SPRING_DATASOURCE_USERNAME: shelfsense
          SPRING_DATASOURCE_PASSWORD: shelfsense_dev
          SHELF_SENSE_ML_URL: http://127.0.0.1:8001
        run: |
          chmod +x ./mvnw
          ./mvnw clean test

  ml:
    name: ML Service Tests (Python 3.11 / Pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install ML dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml/requirements.txt pytest pytest-timeout

      - name: Run Pytest Suite
        run: |
          PYTHONPATH=ml pytest ml/tests/ -v

  frontend:
    name: Frontend Build & Tests (Node 20 / Vite / Vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Vitest Suite
        working-directory: frontend
        run: npm test

      - name: Build Production Frontend
        working-directory: frontend
        run: npm run build
