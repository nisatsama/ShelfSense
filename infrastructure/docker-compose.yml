services:
  postgres:
    image: postgres:16-alpine
    container_name: shelfsense-postgres

    environment:
      POSTGRES_DB: shelfsense
      POSTGRES_USER: shelfsense
      POSTGRES_PASSWORD: shelfsense_dev

    ports:
      - "5432:5432"

    volumes:
      - shelfsense_postgres_data:/var/lib/postgresql/data

volumes:
  shelfsense_postgres_data: