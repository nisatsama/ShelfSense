spring:
  application:
    name: shelfsense

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shelfsense}
    username: ${SPRING_DATASOURCE_USERNAME:shelfsense}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

server:
  port: ${PORT:8080}

shelfsense:
  security:
    jwt:
      issuer: ${SHELF_SENSE_JWT_ISSUER:shelfsense}
      secret: ${SHELF_SENSE_JWT_SECRET:}
      expiration: ${SHELF_SENSE_JWT_EXPIRATION:PT1H}
    cors:
      allowed-origins: ${SHELF_SENSE_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  ml:
    base-url: ${SHELF_SENSE_ML_URL:http://localhost:8001}
    connect-timeout-ms: ${SHELF_SENSE_ML_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${SHELF_SENSE_ML_READ_TIMEOUT_MS:5000}
