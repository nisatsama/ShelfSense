spring:
  application:
    name: shelfsense

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shelfsense}
    username: ${SPRING_DATASOURCE_USERNAME:shelfsense}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

server:
  port: ${PORT:8080}

shelfsense:
  security:
    jwt:
      issuer: ${SHELF_SENSE_JWT_ISSUER:shelfsense}
      secret: ${SHELF_SENSE_JWT_SECRET:}
      expiration: ${SHELF_SENSE_JWT_EXPIRATION:PT15M}
